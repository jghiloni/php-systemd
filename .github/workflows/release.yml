name: Create php-systemd release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-${{ matrix.versions.os }}
    strategy:
      matrix:
        versions:
          - { os: "24.04", php: "8.3" }
          - { os: "26.04", php: "8.5" }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Dependencies
        run: sudo apt-get -y update && sudo apt-get -y install php${{ matrix.versions.php }}-dev libsystemd-dev
      - name: Build
        id: build
        env:
          VERSION: ${{github.ref_name}}
        run: |
          phpize
          ./configure --with-systemd
          make
          mv modules/systemd.so modules/ubuntu-${{ matrix.versions.os }}-php-${{ matrix.versions.php }}-systemd.so.${VERSION#v*}
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          path: modules/ubuntu-${{ matrix.versions.os }}-php-${{ matrix.versions.php }}-systemd.so.*
  create-release:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Download a Build Artifact
        uses: actions/download-artifact@v8.0.1
      - name: GH Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          files: |
            php_systemd.h
            ubuntu-*-systemd.so.*

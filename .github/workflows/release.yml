name: Create php-systemd release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write 

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Dependencies
        run: sudo apt-get -y update && sudo apt-get -y install php8.5-dev libsystemd-dev
      - name: Build
        id: build
        env:
          VERSION: ${{github.ref_name}}
        run: |
            ./configure
            make
            mv modules/systemd.so modules/systemd.so.${VERSION#v*}
            echo "SO_FILE=modules/systemd.so.${VERSION#v*}" >> ${GITHUB_OUTPUT}
      - name: GH Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          files: |
            php_systemd.h
            ${{ steps.build.outputs.SO_FILE}}